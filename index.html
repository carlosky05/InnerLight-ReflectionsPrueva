<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InnerLight Reflections</title>

  <link rel="icon" type="image/png" href="img/Logo_kristine.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Estilo.css" />
</head>

<body>

<!-- Fondo de la portada, detrás del selector -->
<section class="hero-banner pantalla-completa" style="background-image: url('img/fondo5.jpg');">
  <div class="container">
    <h1>InnerLight Reflections</h1>
  </div>
</section>

<!-- Selector de país: lleva a España o a USA según la respuesta -->
<div id="country-popup" role="dialog" aria-modal="true" aria-labelledby="country-title">
  <div class="popup-content">
    <h3 id="country-title">¿Desde donde me estás visitando?</h3>
    <h3>Where are you located?</h3>

    <div class="button-row">
      <a class="opcion-pais" href="España/index.html" onclick="try{localStorage.setItem('idioma','es')}catch(e){}">España
        <img src="https://flagcdn.com/w40/es.png" width="24" alt="">
      </a>
      <a class="opcion-pais" href="USA/home.html" onclick="try{localStorage.setItem('idioma','en')}catch(e){}">USA
        <img src="https://flagcdn.com/w40/us.png" width="24" alt="">
      </a>
    </div>
  </div>
</div>

</body>
</html>
